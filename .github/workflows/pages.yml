name: Publish clan snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: clan-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Read saved clan observations
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID }}
          CLAN_TAG: ${{ vars.CLAN_TAG }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: python3 tools/fetch_d1.py --output .private/source
      - name: Build validated publication
        run: |
          python3 tools/previous.py
          python3 tools/build.py --input .private/source/archive.json --status .private/source/status.json --previous .private/previous
      - name: Test browser analysis
        run: node --test test/*.test.mjs
      - name: Test export reader
        run: python3 -m unittest discover -s test -p 'test_*.py' -v
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static snapshot
        id: deployment
        uses: actions/deploy-pages@v4
